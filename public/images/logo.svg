<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5A253"/>
      <stop offset="50%" stop-color="#D4B96A"/>
      <stop offset="100%" stop-color="#C5A253"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B5D3B"/>
      <stop offset="100%" stop-color="#073D2A"/>
    </linearGradient>
  </defs>

  <!-- Crescent -->
  <path d="M42 28 C42 10 54 0 66 0 C54 4 44 14 44 30 C44 44 52 52 62 54 C52 50 42 42 42 28Z" fill="url(#goldGrad)"/>

  <!-- Star -->
  <polygon points="66,8 68.5,14 75,14 70,18 72,24 66,20 60,24 62,18 57,14 63.5,14" fill="url(#goldGrad)"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="10" r="2" fill="#C5A253" opacity="0.5"/>
  <circle cx="86" cy="16" r="1.5" fill="#C5A253" opacity="0.35"/>
  <circle cx="78" cy="18" r="1.5" fill="#C5A253" opacity="0.35"/>

  <!-- Divine light rays from crescent -->
  <line x1="42" y1="14" x2="34" y2="6" stroke="#C5A253" stroke-width="1.5" opacity="0.3"/>
  <line x1="38" y1="18" x2="28" y2="12" stroke="#C5A253" stroke-width="1.5" opacity="0.25"/>
  <line x1="40" y1="8" x2="36" y2="0" stroke="#C5A253" stroke-width="1.5" opacity="0.2"/>

  <!-- Main title -->
  <text x="105" y="38" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#FFFDF7" letter-spacing="1">Maulana Hafiz Ali</text>

  <!-- Subtitle -->
  <text x="105" y="60" font-family="Georgia, serif" font-size="14" fill="#DFD7C5" letter-spacing="2">ISLAMIC SPIRITUAL GUIDE</text>

  <!-- Decorative line -->
  <line x1="105" y1="70" x2="380" y2="70" stroke="#C5A253" stroke-width="0.8" opacity="0.4"/>

  <!-- Arabic subtitle -->
  <text x="105" y="92" font-family="Arial, sans-serif" font-size="16" fill="#C5A253" letter-spacing="0.5" font-weight="500">مولانا حافظ علي - الإرشاد الروحي الإسلامي</text>

  <!-- Small decorative diamond -->
  <rect x="95" y="34" width="6" height="6" rx="1" fill="#C5A253" opacity="0.6" transform="rotate(45 98 37)"/>
</svg>
